name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The tested modules only need NumPy and OpenCV, so PyTorch and
      # Ultralytics are not installed to keep this job fast.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless pillow -r requirements-dev.txt

      - name: Lint (syntax errors and undefined names only)
        run: |
          pip install ruff
          ruff check --select E9,F63,F7,F82 .

      - name: Run tests
        run: pytest tests -q
